# infra/providers/runtime.yaml
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata: { name: provider-kubernetes }
spec:
  serviceAccountTemplate:
    metadata: { name: provider-kubernetes }
  deploymentTemplate:
    spec:
      selector: { matchLabels: { pkg.crossplane.io/provider: provider-kubernetes } }
      template:
        metadata: { labels: { pkg.crossplane.io/provider: provider-kubernetes } }
        spec:
          containers:
            - { name: package-runtime, args: ["--poll=15s"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: provider-kubernetes-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: provider-kubernetes, namespace: crossplane-system }
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata: { name: provider-helm }
spec:
  serviceAccountTemplate:
    metadata: { name: provider-helm }
  deploymentTemplate:
    spec:
      selector: { matchLabels: { pkg.crossplane.io/provider: provider-helm } }
      template:
        metadata: { labels: { pkg.crossplane.io/provider: provider-helm } }
        spec:
          containers:
            - { name: package-runtime, args: ["--poll=15s"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: provider-helm-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: provider-helm, namespace: crossplane-system }

