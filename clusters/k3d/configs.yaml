# clusters/k3d/configs.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: configs, namespace: flux-system }
spec:
  interval: 10m
  path: ./infra/configs
  prune: true
  wait: true
  sourceRef: { kind: GitRepository, name: flux-system }
  dependsOn: [{ name: providers }]

